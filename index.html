<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4汗的辦公室</title>
<style>
:root{
  --bg:#07090f; --gold:#d4af37; --gold2:#f0d27a; --ink:#f4eddc; --dim:#a99f86; --mute:#7c7666;
  --work:#43e08a; --wait:#ffa53a; --idle:#f0d27a; --unk:#8a8d96;
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","Source Han Serif TC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:radial-gradient(1200px 800px at 38% 10%,#10162a 0%,#0a0d17 45%,#06080d 100%) fixed,var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.15;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08;transform:scale(.8)}50%{opacity:.85;transform:scale(1.3)}}

/* ---------- layout ---------- */
.main{position:relative;z-index:1;padding:14px 12px 28px}
.stage-wrap{width:100%;max-width:780px;margin:0 auto}
@media(min-width:1000px){
  .main{padding:10px 392px 28px 24px}
  .stage-wrap{max-width:none;width:min(100%,max(640px,calc(100vh*.84)),800px)}
}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:3/4;container-type:inline-size;user-select:none}
.glow{position:absolute;left:8%;right:8%;top:6%;height:80%;background:radial-gradient(closest-side,rgba(212,175,55,.16),transparent 72%);animation:breathe 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.art{position:absolute;inset:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 6%,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 8%,#000 92%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,transparent 0,#000 6%,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 8%,#000 92%,transparent 100%);
  mask-composite:intersect}
.art img{width:100%;height:100%;display:block;filter:saturate(1.05) contrast(1.04)}
.lights{position:absolute;inset:0;pointer-events:none}
.lights i{position:absolute;width:max(2px,.45cqw);height:max(2px,.6cqw);background:#ffd98a;box-shadow:0 0 6px 1px rgba(255,200,100,.6);opacity:.1;animation:tw 5s ease-in-out infinite;border-radius:1px}

/* brand + sign */
.brand{position:absolute;left:2.6%;top:1.6%;display:flex;align-items:center;gap:1.6cqw;z-index:8;pointer-events:none}
.emblem{flex:none;width:max(34px,6.6cqw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 200deg,#6f5010,#f0d27a,#b88a22,#fff1b5,#8a6516,#e8c768,#6f5010);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 22px rgba(212,175,55,.5),0 4px 12px rgba(0,0,0,.6)}
.emblem b{width:82%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2a2010,#0a0804 72%);border:1px solid rgba(255,230,160,.85);
  font:700 max(11px,2.45cqw)/1 var(--serif);color:var(--gold2);letter-spacing:-.02em;text-shadow:0 0 8px rgba(240,210,122,.6)}
.brand h1{font:900 max(16px,3.5cqw)/1.1 var(--serif);letter-spacing:.14em;background:linear-gradient(180deg,#fff3c4,#e5c25a 55%,#a67c1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.brand p{margin-top:.5cqw;font-size:max(8px,1.4cqw);letter-spacing:.14em;color:#cfc4a4;text-shadow:0 1px 4px #000;white-space:nowrap}
.sign{position:absolute;left:53%;top:8.6%;transform:translateX(-50%);z-index:7;pointer-events:none;
  padding:max(2px,.7cqw) 3.6cqw;font:900 max(11px,2.9cqw)/1.2 var(--serif);letter-spacing:.2em;color:var(--gold2);white-space:nowrap;
  background:linear-gradient(180deg,#1b150b,#0b0905);border:1px solid var(--gold);border-radius:3px;
  box-shadow:0 0 0 max(2px,.35cqw) #0b0905,0 0 0 calc(max(2px,.35cqw) + 1px) rgba(212,175,55,.55),0 0 26px rgba(212,175,55,.3),inset 0 0 14px rgba(212,175,55,.18);text-shadow:0 0 10px rgba(240,210,122,.55)}
.sign:before,.sign:after{content:"";position:absolute;top:50%;width:max(4px,.9cqw);height:max(4px,.9cqw);background:var(--gold2);transform:translateY(-50%) rotate(45deg);box-shadow:0 0 8px var(--gold)}
.sign:before{left:1.2cqw}.sign:after{right:1.2cqw}

/* floor plates */
.plate{position:absolute;left:.8%;width:16%;z-index:6;text-align:left;transform:translateY(-50%) skewY(8deg);transform-origin:50% 50%;
  padding:.8cqw 1.1cqw .9cqw;border-radius:max(4px,.8cqw);
  background:linear-gradient(180deg,rgba(28,22,10,.88),rgba(9,7,4,.86));
  border:1px solid rgba(212,175,55,.85);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),inset 0 0 0 3px rgba(212,175,55,.22),0 6px 18px rgba(0,0,0,.65),0 0 18px rgba(212,175,55,.14);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:box-shadow .2s,filter .2s,border-color .2s}
.plate:hover,.plate.on{border-color:#ffe596;filter:brightness(1.18);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),inset 0 0 0 3px rgba(240,210,122,.5),0 6px 18px rgba(0,0,0,.65),0 0 26px rgba(240,210,122,.5)}
.plate:focus-visible{outline:2px solid #fff;outline-offset:2px}
.plate .r1{display:flex;align-items:baseline;justify-content:space-between;gap:.6cqw}
.plate .id{font:900 max(13px,2.5cqw)/1 var(--serif);color:var(--gold2);letter-spacing:.04em;text-shadow:0 0 8px rgba(212,175,55,.4)}
.plate .n{font-size:max(8px,1.25cqw);color:#cdbf94;white-space:nowrap}
.plate .nm{display:block;margin-top:.35cqw;font-size:max(9px,1.6cqw);font-weight:700;color:var(--gold);white-space:nowrap;letter-spacing:.03em}
.dots{display:flex;gap:max(2px,.4cqw);margin-top:.7cqw;flex-wrap:wrap}
.dots i{width:max(4px,.78cqw);height:max(4px,.78cqw);border-radius:50%;background:var(--unk);opacity:.75}
.dots i.working{background:var(--work);opacity:1;box-shadow:0 0 5px var(--work)}
.dots i.waiting{background:var(--wait);opacity:1;box-shadow:0 0 5px var(--wait)}
.dots i.idle{background:var(--idle);opacity:1;box-shadow:0 0 5px var(--idle)}

/* grey chips */
.chip{position:absolute;z-index:4;transform:translate(-50%,-50%);padding:.3cqw 1.2cqw;border-radius:999px;font-size:max(8px,1.25cqw);white-space:nowrap;
  color:#b9bbc3;background:rgba(14,16,22,.7);border:1px dashed rgba(170,172,184,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);transition:color .2s,border-color .2s}
.chip:hover{color:#fff;border-color:rgba(240,210,122,.7)}

/* status tags */
.tag{position:absolute;z-index:5;transform:translate(-50%,-100%)}
.tag .in{display:flex;align-items:center;gap:1cqw;padding:.6cqw 1.5cqw .65cqw 1.2cqw;border-radius:max(8px,1.6cqw);
  background:linear-gradient(180deg,rgba(18,20,28,.86),rgba(7,9,14,.86));border:1px solid rgba(240,210,122,.55);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6),0 0 18px rgba(212,175,55,.12);
  animation:fl 4.6s ease-in-out infinite alternate;animation-delay:var(--d,0s);transition:border-color .2s,box-shadow .2s}
.tag:after{content:"";position:absolute;left:var(--ax,50%);bottom:-.7cqw;width:1.2cqw;height:1.2cqw;background:rgba(9,11,16,.9);border-right:1px solid rgba(240,210,122,.55);border-bottom:1px solid rgba(240,210,122,.55);transform:translateX(-50%) rotate(45deg)}
@keyframes fl{from{transform:translateY(-.5cqw)}to{transform:translateY(.55cqw)}}
.tag:hover .in,.tag.hl .in{border-color:#fff1b8;box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 0 1px rgba(255,241,184,.6),0 0 26px rgba(240,210,122,.65)}
.tag.hl{z-index:9}
.tag:focus-visible .in{outline:2px solid #fff}
.dot{position:relative;flex:none;width:max(6px,1.05cqw);height:max(6px,1.05cqw);border-radius:50%;background:var(--unk)}
.working .dot{background:var(--work);animation:pulse 1.7s ease-out infinite}
.waiting .dot{background:var(--wait)}
.idle .dot{background:var(--idle)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,224,138,.75)}80%,100%{box-shadow:0 0 0 max(6px,1.1cqw) rgba(67,224,138,0)}}
.tag .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0}
.tag .nm{font-size:max(9px,1.75cqw);font-weight:800;color:#fff;max-width:19cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.tag .tg{font-size:max(8px,1.4cqw);color:var(--dim);max-width:19cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.working .tg{color:#9ff0c2}.waiting .tg{color:#ffc680}.idle .tg{color:#f3dd9c}
.q{flex:none;width:max(10px,1.9cqw);height:max(10px,1.9cqw);border-radius:50%;display:grid;place-items:center;background:var(--wait);color:#1b1000;font:900 max(7px,1.3cqw)/1 var(--sans);box-shadow:0 0 8px rgba(255,165,58,.7);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.18)}}

/* ticker */
.ticker{position:absolute;left:8%;right:8%;top:95.2%;height:max(18px,3.1cqw);z-index:6;display:flex;align-items:stretch;overflow:hidden;border-radius:2px;
  background:linear-gradient(180deg,rgba(14,11,5,.93),rgba(5,4,2,.93));border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);box-shadow:0 0 18px rgba(212,175,55,.2),0 6px 16px rgba(0,0,0,.6)}
.ticker .lb{flex:none;display:grid;place-items:center;padding:0 1.8cqw;background:linear-gradient(180deg,#f0d27a,#b88a22);color:#1b1304;font-weight:900;font-size:max(8px,1.35cqw);letter-spacing:.14em;z-index:2}
.ticker .win{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent)}
.ticker .run{display:flex;white-space:nowrap;animation:run 46s linear infinite;will-change:transform}
.ticker .run span{padding:0 4cqw 0 0;font-size:max(9px,1.5cqw);color:var(--gold2)}
.ticker .run span b{color:#fff;font-weight:800}
.ticker .run span em{font-style:normal;display:inline-block;width:.8cqw;height:.8cqw;min-width:5px;min-height:5px;border-radius:50%;margin-right:.9cqw;vertical-align:.05em}
@keyframes run{to{transform:translateX(-50%)}}

/* floor list (small screens) */
.msub{display:none;text-align:center;margin-top:8px;font-size:11px;letter-spacing:.14em;color:var(--dim)}
.floorlist{display:none;list-style:none;margin:6px 0 0;gap:6px;flex-direction:column}
.floorlist button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:9px 12px;border-radius:10px;
  background:linear-gradient(180deg,rgba(26,21,11,.85),rgba(10,8,5,.85));border:1px solid rgba(212,175,55,.45)}
.floorlist .id{font:900 20px/1 var(--serif);color:var(--gold2);min-width:34px}
.floorlist .nm{font-weight:700;font-size:14px;color:var(--ink)}
.floorlist .meta{font-size:11px;color:var(--dim);grid-column:2}
.floorlist .dots{margin:0;grid-row:1/3;grid-column:3;max-width:70px;justify-content:flex-end}
.floorlist .dots i{width:6px;height:6px}
.floorlist .ttl{font-size:11px;letter-spacing:.2em;color:var(--gold);margin:12px 4px 2px}

/* ---------- panel ---------- */
.panel{position:relative;z-index:2;width:100%;max-width:780px;margin:14px auto 0;padding:18px 18px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(14,16,24,.82),rgba(7,9,14,.86));border:1px solid rgba(212,175,55,.35);
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.5),inset 0 1px 0 rgba(240,210,122,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media(min-width:1000px){
  .panel{position:fixed;right:18px;top:18px;bottom:18px;width:350px;max-width:none;margin:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(212,175,55,.5) transparent}
}
.sec{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.sec b{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:700}
.sec span{font-size:12px;color:var(--dim);letter-spacing:.12em}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.6),transparent);align-self:center;margin-left:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;padding:12px 14px 11px;border-radius:8px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid rgba(212,175,55,.28);overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.tile:after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.14}
.tile .num{font:700 40px/1 var(--serif);color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent);font-variant-numeric:tabular-nums}
.tile .lab{margin-top:6px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px}
.tile .lab i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tile.working{--c:var(--work)}.tile.waiting{--c:var(--wait)}.tile.idle{--c:var(--idle)}.tile.unknown{--c:#9a9da8}
.prog{margin:14px 0 4px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.prog b{color:var(--gold2);font-weight:700}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9a7a1e,#f0d27a);box-shadow:0 0 10px rgba(240,210,122,.6)}
.sep{height:1px;margin:18px 0 14px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.5),transparent)}
.news{list-style:none;display:flex;flex-direction:column;gap:12px}
.news li{position:relative;padding-left:14px}
.news li:before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.news li.working{--c:var(--work)}.news li.waiting{--c:var(--wait)}.news li.idle{--c:var(--idle)}
.news .who{font-size:13px;font-weight:700;color:var(--gold2);display:flex;gap:8px;align-items:center}
.news .who small{font-size:10px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:99px;padding:0 6px;line-height:16px}
.news .tx{margin-top:3px;font-size:12.5px;line-height:1.55;color:#e6dfcb}
.news .tm{margin-top:3px;font-size:10.5px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.note{margin-top:12px;font-size:10.5px;color:var(--mute);line-height:1.6}
footer{position:relative;z-index:1;max-width:780px;margin:18px auto 0;text-align:center;font-size:12px;color:var(--dim);line-height:1.8}
footer small{display:block;font-size:11px;color:var(--mute)}
@media(min-width:1000px){footer{max-width:none;width:min(100%,max(640px,calc(100vh*.84)),800px)}}

/* ---------- drawer ---------- */
.drawer{position:fixed;z-index:50;right:18px;top:18px;bottom:18px;width:350px;display:flex;flex-direction:column;border-radius:14px;
  background:linear-gradient(180deg,rgba(20,18,12,.94),rgba(8,9,13,.95));border:1px solid rgba(240,210,122,.6);
  box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 40px rgba(212,175,55,.18),inset 0 1px 0 rgba(255,236,170,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transform:translateX(30px);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s .28s}
.drawer.open{transform:none;opacity:1;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .22s}
.dh{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid rgba(212,175,55,.3)}
.dh .id{font:900 30px/1 var(--serif);color:var(--gold2);text-shadow:0 0 12px rgba(212,175,55,.5)}
.dh .t{flex:1;min-width:0}
.dh .t b{display:block;font-size:16px;color:var(--ink)}
.dh .t span{font-size:11.5px;color:var(--dim)}
.dh .x{width:30px;height:30px;border-radius:50%;border:1px solid rgba(212,175,55,.5);color:var(--gold2);font-size:16px;line-height:1}
.dh .x:hover{background:rgba(212,175,55,.2)}
.dl{list-style:none;overflow:auto;flex:1;padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:rgba(212,175,55,.5) transparent}
.dl button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);transition:background .15s,border-color .15s}
.dl button:hover{background:rgba(255,255,255,.07)}
.dl .on{background:rgba(212,175,55,.14);border-color:rgba(240,210,122,.75);box-shadow:0 0 18px rgba(212,175,55,.2)}
.dl .dot{margin-top:.4em;width:9px;height:9px}
.dl .working .dot,.dl .waiting .dot,.dl .idle .dot,.dl .unknown .dot{animation-duration:1.7s}
.dl .waiting .dot,.dl .idle .dot,.dl .unknown .dot{animation:none}
.dl .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl .st{font-size:10px;font-weight:600;padding:0 7px;line-height:16px;border-radius:99px;border:1px solid currentColor}
.dl .working .st{color:var(--work)}.dl .waiting .st{color:var(--wait)}.dl .idle .st{color:var(--idle)}.dl .unknown .st{color:#9a9da8}
.dl .ac{grid-column:2;font-size:12.5px;line-height:1.55;color:#e6dfcb}
.dl .unknown .ac{color:var(--mute)}
.dl .hint{display:block;font-size:10.5px;color:#6d6a5f;margin-top:1px}
.df{padding:9px 16px 13px;border-top:1px solid rgba(212,175,55,.2);font-size:10.5px;color:var(--mute)}


/* ---------- LEGO minifigures ---------- */
.mfs{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.mf{pointer-events:all;cursor:pointer;outline:none}
.mf .fig{transform-box:fill-box;transform-origin:50% 92%;transition:transform .16s ease,filter .16s}
.mf-working .fig,.mf-waiting .fig,.mf-idle .fig{filter:brightness(1.04) saturate(1.08)}
.mf-unknown .fig{filter:saturate(.72) brightness(.9)}
.mf:hover .fig,.mf.hl .fig,.mf:focus-visible .fig{transform:scale(1.2);filter:brightness(1.12) drop-shadow(0 0 3px rgba(255,229,150,.95))}
.mf-unknown:hover .fig,.mf-unknown.hl .fig{filter:saturate(.8) brightness(1.05) drop-shadow(0 0 3px rgba(255,229,150,.95))}
.mf .bobL,.mf .bobR{animation:mfbob .7s ease-in-out infinite alternate}
.mf .bobR{animation-delay:-.35s}
@keyframes mfbob{from{transform:translateY(0)}to{transform:translateY(-1.1px)}}
.mf .wave{animation:mfwave 1.1s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes mfwave{from{transform:rotate(-170deg)}to{transform:rotate(-140deg)}}
.mf .bang{animation:mfbang 1.5s ease-in-out infinite alternate}
@keyframes mfbang{from{transform:translate(-19.5px,-37px)}to{transform:translate(-19.5px,-39.4px)}}
.mf .steam{animation:mfsteam 2.4s ease-in-out infinite}
.mf .steam.s2{animation-delay:-1.2s}
@keyframes mfsteam{0%{opacity:0;transform:translateY(1.5px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-2.5px)}}
.mf .zz .z1{animation:mfz 3.2s ease-in-out infinite}
.mf .zz .z2{animation:mfz 3.2s ease-in-out infinite;animation-delay:-1.4s}
@keyframes mfz{0%{opacity:.15;transform:translateY(1.5px)}50%{opacity:.95}100%{opacity:.15;transform:translateY(-2px)}}
.mf .lap rect:nth-child(2){animation:mfscr 2.6s ease-in-out infinite alternate}
@keyframes mfscr{from{stroke-opacity:.65}to{stroke-opacity:1}}
.mtip{position:absolute;z-index:10;transform:translate(-50%,-100%);pointer-events:none;padding:.35cqw 1.3cqw;border-radius:max(6px,1cqw);white-space:nowrap;font-size:max(10px,1.7cqw);font-weight:800;color:#fff;
  background:linear-gradient(180deg,rgba(18,20,28,.94),rgba(7,9,14,.94));border:1px solid rgba(240,210,122,.7);box-shadow:0 6px 16px rgba(0,0,0,.6);opacity:0;transition:opacity .12s}
.mtip.on{opacity:1}
.mtip small{margin-left:.9cqw;font-size:max(8px,1.35cqw);font-weight:600;color:var(--dim)}
.mtip.working small{color:#9ff0c2}.mtip.waiting small{color:#ffc680}.mtip.idle small{color:#f3dd9c}
@media(max-width:700px){.mtip{font-size:max(9px,2.6cqw)}}

/* ---------- small screens ---------- */
@media(max-width:700px){
  .floorlist{display:flex}.msub{display:block}
  .plate{left:1%;width:10.5%;padding:.8cqw 0;text-align:center;transform:translateY(-50%) skewY(7deg)}
  .plate .r1{justify-content:center}.plate .n,.plate .nm,.plate .dots{display:none}
  .plate .id{font-size:max(11px,3.7cqw)}
  .tag .tg,.tag .q{display:none}
  .tag .in{gap:.9cqw;padding:.55cqw 1.4cqw .55cqw 1.1cqw}
  .tag .nm{font-size:max(8px,2.35cqw);max-width:26cqw}
  .tag.waiting .nm:after{content:" ?";color:var(--wait)}
  .dot{width:max(5px,1.4cqw);height:max(5px,1.4cqw)}
  .chip{font-size:max(7px,2cqw);padding:.2cqw 1.1cqw}
  .brand .sub{display:none}.brand p{display:none}
  .brand h1{font-size:max(14px,4.6cqw)}
  .sign{font-size:max(10px,3.7cqw);letter-spacing:.14em}
  .ticker{left:4%;right:4%;height:max(16px,4.2cqw)}
  .ticker .lb{font-size:max(7px,2cqw);padding:0 2cqw}
  .ticker .run span{font-size:max(8px,2.1cqw)}
  .drawer{left:0;right:0;top:auto;bottom:0;width:auto;max-height:80vh;border-radius:18px 18px 0 0;transform:translateY(40px)}
  .panel{padding:16px 14px}
  .tile .num{font-size:34px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function fullTime(i){var t=tpe(i);return t.y+"/"+t.m+"/"+t.d+" "+t.H+":"+t.M+"（台北時間）"}
function shortTime(i){var t=tpe(i);return t.m+"/"+t.d+" "+t.H+":"+t.M}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}

  var o={status:s,kind:p[0],c:p[1],a:p[2],hair:MF_HAIR[(gi*7+2)%MF_HAIR.length],hc:MF_HC[(gi*3+1)%MF_HC.length],capc:MF_CAP[gi%MF_CAP.length],pants:MF_PANTS[(gi*5+1)%MF_PANTS.length],face:MF_FACE[(gi*5+2)%MF_FACE.length],glasses:!!MF_GLASS[(gi*3+1)%MF_GLASS.length]};
  if(isBoss){o.kind="vest";o.c="#e9e6df";o.a="#ff8a1a";o.hair="hat";o.face="grin";o.glasses=false;o.pants="#2a3550"}
  var sc=seat[3]||(.74+.16*seat[2]);
  var g=document.createElementNS(SVGNS,"g");g.setAttribute("class","mf mf-"+s);g.setAttribute("transform","translate("+seat[0]+" "+seat[1]+") scale("+sc.toFixed(3)+")");
  g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",b.name+"（樂高小人）："+ST[s]);g.dataset.name=b.name;
  var inner=document.createElementNS(SVGNS,"g");inner.setAttribute("class","fig");inner.style.animationDelay=(-(hash(b.name)%30)/10)+"s";
  inner.innerHTML=figureSVG(o);g.appendChild(inner);
    return {g:g,sc:sc}}

/* seat positions (hip centre, in 864x1152 image px) measured from the chairs/tables in the picture: [x, y, depth 0=back..1=front] */
var SEATS={
 "ph":[[455,259,1,.95]],
 1:[[288,378,.15],[324,376,.15],[415,400,.3],[451,398,.3],[520,440,.8]],
 2:[[314,492,.15],[350,490,.15],[424,522,.4],[460,520,.4],[516,564,.9]],
 3:[[294,606,.15],[328,604,.15],[362,614,.3],[419,650,.4],[453,648,.4],[487,686,.9],[521,688,.9]],
 4:[[310,718,.15],[346,720,.15],[382,730,.3],[424,771,.4],[460,771,.4]],
 5:[[314,838,.15],[350,840,.15],[430,878,.4],[466,878,.4]],
 6:[[298,946,.3],[334,944,.3],[366,968,.5],[420,988,.6],[482,1034,.9]]
};
var KNOWN_SEAT={"蓋大樓":["ph",0],"工商時報及經濟日報":[2,3],"癌症小專家":[4,1],"重大傷病小助理":[5,2],"Grok Bot":[6,0],"人類圖分析":[6,3]};
var TAG_DX={"重大傷病小助理":45,"Grok Bot":-30,"人類圖分析":30},TAG_DY={},CHIPX=232;

/* ---------- plates / chips / tags ---------- */
var plates=$("plates"),chips=$("chips"),tags=$("tags"),mfg=$("mfg"),tagByBot={},figByBot={},plateById={},gi=0;
function dotsRow(f){var d=el("span","dots");f.bots.slice().sort(function(a,b){return ORDER.indexOf(st(a))-ORDER.indexOf(st(b))}).forEach(function(b){d.appendChild(el("i",st(b)))});return d}
FLOORS.forEach(function(f,fi){
  var cy=0;f.rooms.forEach(function(r){cy+=roomY(r,150)});cy/=f.rooms.length;
  var p=el("button","plate");p.type="button";p.style.top=px(cy/H);p.setAttribute("aria-label",f.tab+" "+f.name+"，"+f.bots.length+" 位，查看詳細");
  var r1=el("span","r1");r1.appendChild(el("span","id",f.tab));r1.appendChild(el("span","n",f.bots.length+" 位"));p.appendChild(r1);
  p.appendChild(el("span","nm",f.plate));p.appendChild(dotsRow(f));
  p.addEventListener("click",function(){openFloor(fi)});
  plates.appendChild(p);plateById[f.id]=p;

  var unk=f.bots.filter(function(b){return st(b)==="unknown"});
  if(unk.length){var c=el("button","chip","+"+unk.length+" 位尚未讀取");c.type="button";c.style.left=px(CHIPX/W);c.style.top=px((roomY(f.rooms[0],255)+(f.rooms[0]==="ph"?0:f.rooms[0]===6?32:24))/H);c.addEventListener("click",function(){openFloor(fi)});chips.appendChild(c)}

  /* seats: one LEGO minifigure per bot */
  var seatList=[];f.rooms.forEach(function(r){(SEATS[r]||[]).forEach(function(s,i){seatList.push({room:r,idx:i,s:s,used:false})})});
  var assigned={};
  f.bots.forEach(function(b){var ks=KNOWN_SEAT[b.name];if(!ks||st(b)==="unknown")return;
    for(var q=0;q<seatList.length;q++){if(seatList[q].room===ks[0]&&seatList[q].idx===ks[1]&&!seatList[q].used){seatList[q].used=true;assigned[b.name]=seatList[q];break}}});
  f.bots.forEach(function(b){if(assigned[b.name])return;
    for(var q=0;q<seatList.length;q++){if(!seatList[q].used){seatList[q].used=true;assigned[b.name]=seatList[q];break}}});
  f.bots.forEach(function(b){
    var seat=assigned[b.name];if(!seat)return;gi++;
    var s=st(b),mf=makeFig(b,gi,seat.s),fg=mf.g;
    mfg.appendChild(fg);figByBot[f.id+"|"+b.name]=fg;
    fg.addEventListener("click",function(){openFloor(fi,b.name)});
    fg.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openFloor(fi,b.name)}});
    if(s==="unknown"){
      var tip=$("mtip");
      var show=function(){tip.textContent="";tip.appendChild(document.createTextNode(b.name));tip.appendChild(el("small",null,ST[s]));tip.className="mtip on "+s;tip.style.left=px(seat.s[0]/W);tip.style.top=px((seat.s[1]-41*mf.sc-3)/H)};
      var hide=function(){tip.className="mtip"};
      fg.addEventListener("mouseenter",show);fg.addEventListener("mouseleave",hide);fg.addEventListener("focus",show);fg.addEventListener("blur",hide);
    }else{
      var dx=(TAG_DX[b.name]||0),dy=(TAG_DY[b.name]||0);
      var t=el("button","tag "+s);t.type="button";t.style.left=px((seat.s[0]+dx)/W);t.style.top=px((seat.s[1]-41*mf.sc-8+dy)/H);t.style.setProperty("--d",(-(hash(b.name)%40)/10)+"s");if(dx)t.style.setProperty("--ax","calc(50% - "+(dx/W*100).toFixed(3)+"cqw)");
      t.setAttribute("aria-label",b.name+"："+ST[s]+(b.tag?"，"+b.tag:""));t.title=b.name+"（"+ST[s]+"）";
      var inn=el("span","in");inn.appendChild(el("i","dot"));
      var tx=el("span","tx");tx.appendChild(el("span","nm",b.name));tx.appendChild(el("span","tg",b.tag||b.activity||ST[s]));inn.appendChild(tx);
      if(s==="waiting")inn.appendChild(el("span","q","?"));
      t.appendChild(inn);t.addEventListener("click",function(){openFloor(fi,b.name)});
      tags.appendChild(t);tagByBot[f.id+"|"+b.name]=t;
    }
  });
});

/* ---------- mobile floor list ---------- */
(function(){var ul=$("floorlist");ul.appendChild(el("li","ttl","FLOORS　樓層（點選查看）"));
FLOORS.forEach(function(f,fi){var li=el("li"),b=el("button");b.type="button";b.appendChild(el("span","id",f.tab));b.appendChild(el("span","nm",f.name));
var k=f.bots.filter(function(x){return st(x)!=="unknown"}).length;b.appendChild(dotsRow(f));b.appendChild(el("span","meta",f.bots.length+" 位・已讀取 "+k+"／"+f.bots.length));
b.addEventListener("click",function(){openFloor(fi)});li.appendChild(b);ul.appendChild(li)})})();

/* ---------- ticker ---------- */
var known=[];FLOORS.forEach(function(f){f.bots.forEach(function(b){if(st(b)!=="unknown")known.push({b:b,f:f})})});
known.sort(function(a,b){return ORDER.indexOf(st(a.b))-ORDER.indexOf(st(b.b))});
var colors={working:"var(--work)",waiting:"var(--wait)",idle:"var(--idle)"};
(function(){var run=$("run");
function pass(){var g=el("div");g.style.display="flex";known.forEach(function(k){var s=el("span");var e=el("em");e.style.background=colors[st(k.b)];s.appendChild(e);s.appendChild(el("b",null,k.b.name));s.appendChild(document.createTextNode("："+k.b.activity));g.appendChild(s)});
 var s2=el("span");s2.appendChild(document.createTextNode("◆ 資料更新 "+shortTime(D.updatedAt)+"（台北時間）・已讀取 "+read+"／"+total));g.appendChild(s2);return g}
run.appendChild(pass());run.appendChild(pass())})();

/* ---------- panel ---------- */
(function(){
var tiles=$("tiles");ORDER.forEach(function(k){var t=el("div","tile "+k);t.appendChild(el("div","num",String(count[k])));var l=el("div","lab");l.appendChild(el("i"));l.appendChild(document.createTextNode(ST[k]));t.appendChild(l);tiles.appendChild(t)});
$("rd").textContent=read;$("tot").textContent=total;var pc=total?Math.round(read/total*100):0;$("pct").textContent=pc+"%";$("barfill").style.width=Math.max(pc,2)+"%";

if(!known.length){ul.appendChild(el("li",null,"目前沒有已讀取的動態。"))}
known.forEach(function(k){var li=el("li",st(k.b));var w=el("div","who");w.appendChild(el("span",null,k.b.name));w.appendChild(el("small",null,ST[st(k.b)]));li.appendChild(w);li.appendChild(el("div","tx",k.b.activity));li.appendChild(el("div","tm",k.f.tab+" "+(k.f.id==="PH"?"管理室":k.f.name)+"・資料更新 "+shortTime(D.updatedAt)+"（台北）"));ul.appendChild(li)});

document.title=D.title||"4汗的辦公室";

/* ---------- drawer ---------- */
var drawer=$("drawer"),curFloor=-1,lastFocus=null;
function clearHl(){Object.keys(tagByBot).forEach(function(k){tagByBot[k].classList.remove("hl")});Object.keys(figByBot).forEach(function(k){figByBot[k].classList.remove("hl")});Object.keys(plateById).forEach(function(k){plateById[k].classList.remove("on")})}
function openFloor(fi,botName){
  var f=FLOORS[fi];curFloor=fi;clearHl();plateById[f.id].classList.add("on");
  $("did").textContent=f.tab;$("dtitle").textContent=f.id==="PH"?"頂樓・蓋大樓 管理室":f.name;
  var cs={working:0,waiting:0,idle:0,unknown:0};f.bots.forEach(function(b){cs[st(b)]++});
  $("dsub").textContent=f.bots.length+" 位 BOT・"+ORDER.filter(function(k){return cs[k]}).map(function(k){return ST[k]+" "+cs[k]}).join("／");
  var dl=$("dl");dl.textContent="";
  f.bots.slice().sort(function(a,b){return ORDER.indexOf(st(a))-ORDER.indexOf(st(b))}).forEach(function(b){
    var s=st(b),li=el("li"),btn=el("button",s);btn.type="button";btn.dataset.name=b.name;
    btn.appendChild(el("i","dot"));var nm=el("span","nm");nm.appendChild(document.createTextNode(b.name));nm.appendChild(el("span","st",ST[s]));btn.appendChild(nm);
    var ac=el("span","ac");
    if(s==="unknown"){ac.appendChild(document.createTextNode("尚未讀取"));ac.appendChild(el("span","hint","這位 BOT 的最新動態還沒有被讀取，所以先不顯示。"))}else{ac.textContent=b.activity}
    btn.appendChild(ac);
    btn.addEventListener("click",function(){selectRow(f,b.name,btn)});li.appendChild(btn);dl.appendChild(li);
    if(botName&&b.name===botName)selectRow(f,b.name,btn,true);
  });
  $("dfoot").textContent="資料更新："+fullTime(D.updatedAt)+"　（定格畫面，非即時）";
  drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");
}
function selectRow(f,name,btn,noScroll){
  var rows=$("dl").querySelectorAll("button");for(var i=0;i<rows.length;i++)rows[i].classList.remove("on");btn.classList.add("on");
  Object.keys(tagByBot).forEach(function(k){tagByBot[k].classList.remove("hl")});Object.keys(figByBot).forEach(function(k){figByBot[k].classList.remove("hl")});
  var t=tagByBot[f.id+"|"+name];if(t)t.classList.add("hl");var fg=figByBot[f.id+"|"+name];if(fg)fg.classList.add("hl");
  if(!noScroll&&btn.scrollIntoView)btn.scrollIntoView({block:"nearest"});
}
function closeDrawer(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");clearHl();curFloor=-1}
$("dx").addEventListener("click",closeDrawer);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer()});
document.addEventListener("click",function(e){if(curFloor<0)return;if(drawer.contains(e.target))return;if(e.target.closest&&e.target.closest(".plate,.tag,.chip,.floorlist,.mf"))return;closeDrawer()});

/* ---------- ambience: stars + city lights ---------- */
(function(){
var sky=$("sky"),r=rng(20261025),i,e;
for(i=0;i<90;i++){e=el("i");e.style.left=(r()*100)+"%";e.style.top=(r()*100)+"%";var s=.6+r()*1.4;e.style.width=e.style.height=s+"px";e.style.animationDuration=(3+r()*5)+"s";e.style.animationDelay=(-r()*8)+"s";if(r()>.8)e.style.background="#ffe3a0";sky.appendChild(e)}
var L=$("lights"),r2=rng(77);
for(i=0;i<46;i++){e=el("i");var side=r2()<.55?0:1,x=side?(84+r2()*14):(r2()*10),y=4+r2()*70;e.style.left=x+"%";e.style.top=y+"%";e.style.animationDuration=(3+r2()*6)+"s";e.style.animationDelay=(-r2()*9)+"s";L.appendChild(e)}
})();
})();
